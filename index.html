<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIVANT 音声アプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f9fa;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
    }
    /* 上部言語バー */
    .header-lang {
      display: flex;
      background-color: #e3e8ed;
      padding: 14px 16px;
      justify-content: space-around;
      font-size: 0.95rem;
      color: #334155;
      font-weight: bold;
    }
    .lang-selector {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* メインエリア */
    .content-area {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
    }
    /* 青いスピーカーボタン */
    .speaker-btn {
      width: 72px;
      height: 72px;
      background-color: #1a56c4;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 32px;
      margin-top: 10px;
      margin-bottom: 24px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(26,86,196,0.3);
    }
    /* 劇中風テキスト表示（中央・大きめ） */
    .drum-text-display {
      width: 100%;
      text-align: center;
      font-size: 1.3rem;
      font-weight: bold;
      color: #0f172a;
      line-height: 1.7;
      margin-bottom: 24px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-wrap;
      word-break: break-all;
    }
    /* 入力フォーム */
    textarea {
      width: 100%;
      height: 80px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      font-size: 1rem;
      resize: none;
      outline: none;
      background-color: #ffffff;
    }
    /* 実行ボタン */
    .send-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background-color: #1a56c4;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }
    .send-btn:disabled {
      background-color: #94a3b8;
    }
    /* 下部ナビゲーションバー */
    .bottom-nav {
      height: 64px;
      background-color: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      color: #64748b;
      font-size: 0.75rem;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .nav-item.active {
      color: #1a56c4;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header-lang">
    <div class="lang-selector">日本語 <span>▼</span></div>
    <div class="lang-selector">日本語 <span>▼</span></div>
  </div>

  <!-- コンテンツ領域 -->
  <div class="content-area">
    <button class="speaker-btn" id="playBtn" onclick="playCurrentAudio()">🔊</button>

    <div class="drum-text-display" id="resultText">
      ここにドラムのセリフが<br>表示されます
    </div>

    <textarea id="inputText" placeholder="ドラムに喋らせたい文章を入力..."></textarea>
    <button class="send-btn" id="submitBtn" onclick="generateVoice()">喋らせる！</button>
  </div>

  <!-- 下部ナビ -->
  <div class="bottom-nav">
    <div class="nav-item">🌐 <span>翻訳</span></div>
    <div class="nav-item active">🔊 <span>会話</span></div>
    <div class="nav-item">⭐ <span>お気に入り</span></div>
  </div>

<script>
  const API_URL = 'https://vivant-drum-117944023129.asia-northeast2.run.app';
  let lastAudio = null;

  async function generateVoice() {
    const inputText = document.getElementById('inputText').value;
    const submitBtn = document.getElementById('submitBtn');
    const resultText = document.getElementById('resultText');

    if (!inputText.trim()) return;

    submitBtn.disabled = true;
    submitBtn.innerText = '考え中...';
    resultText.innerText = 'ドラムが入力中...';

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: inputText })
      });

      const data = await response.json();

      if (data.error) {
        resultText.innerText = 'エラー: ' + data.error;
      } else {
        resultText.innerText = data.drum_text;

        lastAudio = new Audio('data:audio/mp3;base64,' + data.audio_base64);
        lastAudio.play();
      }
    } catch (e) {
      resultText.innerText = '通信エラーが発生しました';
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = '喋らせる！';
    }
  }

  function playCurrentAudio() {
    if (lastAudio) {
      lastAudio.currentTime = 0;
      lastAudio.play();
    }
  }
</script>

</body>
</html>
